name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check that the lockfile is up to date
        run: uv lock --check

      - name: Lint code
        run: uv run --locked --only-group dev ruff check --output-format=github .

      - name: Check formatting
        run: uv run --locked --only-group dev ruff format --check --diff .

      # with all extras, so that the optional imports are checked too
      - name: Check types
        run: uv run --locked --all-extras ty check --error-on-warning --output-format github
